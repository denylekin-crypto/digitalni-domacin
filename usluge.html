<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usluge | Digitalni domaćin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 520px; margin: 0 auto; }
        .back-button { display: inline-block; margin-bottom: 20px; color: #64748b; text-decoration: none; font-weight: bold; }
        h1 { font-size: 24px; color: #173f5f; margin-bottom: 20px; text-align: center; }
        .service-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px;}
        .icon { font-size: 30px; }
        .info h2 { font-size: 18px; color: #173f5f; margin-bottom: 5px; }
        .info p { color: #64748b; font-size: 14px; margin-bottom: 10px; }
        .btn { background: #173f5f; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 14px; display: inline-block;}
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Nazad</a>
        <h1>🛎️ Usluge za goste</h1>
        
        <div class="service-card">
            <div class="icon">🏎️</div>
            <div class="info">
                <h2>Quad Avantura</h2>
                <p>Iznajmite quad i istražite skrivene dijelove planine uz popust za naše goste.</p>
                <a href="#" class="btn">Rezerviši termin</a>
            </div>
        </div>

        <div class="service-card">
            <div class="icon">💆‍♀️</div>
            <div class="info">
                <h2>Spa & Wellness</h2>
                <p>Relaksacija u partnerskom spa centru. Bazen, saune i masaže.</p>
                <a href="#" class="btn">Zakaži relaksaciju</a>
            </div>
        </div>
    </div>
</body>
</html>
