<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Zlatibora | Digitalni domaćin</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 520px; margin: 0 auto; background: white; border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .back-button { display: inline-block; margin-bottom: 20px; color: #64748b; text-decoration: none; font-weight: bold; }
        h1 { font-size: 24px; color: #173f5f; margin-bottom: 15px; text-align: center; }
        #map { width: 100%; height: 400px; border-radius: 16px; z-index: 1; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Nazad</a>
        <h1>🗺️ Mapa Zlatibora</h1>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([43.7298, 19.6993], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker([43.7298, 19.6993]).addTo(map)
            .bindPopup('<b>Vaš apartman</b><br>Nalazite se ovdje.').openPopup();
        
        L.marker([43.7248, 19.7020]).addTo(map)
            .bindPopup('<b>Gold Gondola</b><br>Početna stanica.');
    </script>
</body>
</html>
